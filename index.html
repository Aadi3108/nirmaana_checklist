ar" style="margin-top:13px"><i style="width:${pct(a)}%"></i></div><div class="muted" style="font-size:10px;margin-top:6px">${a.filter(x=>x.status!=="Done").length} open · ${a.length} total</div></div>`}).join("")}</div>`}
function week(){let a=s.tasks.filter(x=>x.week==="W1");$("content").innerHTML=`<div class="hero"><div><div class="ey">Weekly command center</div><div class="title">W1 · Product foundation</div><div class="sub">Leave the week with product definition, technical foundation and a navigable onboarding flow.</div></div></div><div class="card"><div class="head"><b>Week output</b><span class="pill">${pct(a)}% complete</span></div><div class="bar"><i style="width:${pct(a)}%"></i></div>${a.map(row).join("")}</div>`}
function roadmap(){$("content").innerHTML=`<div class="hero"><div><div class="ey">13-week roadmap</div><div class="title">One product. One sequence.</div><div class="sub">Data before AI. Rules engine before narration. Beta before launch. Every week has a product gate.</div></div></div><div class="card">${s.weeks.map(w=>{let a=s.tasks.filter(x=>x.week===w[0]);return `<div class="week"><div><b>${w[0]}</b><br><small>${w[1]}</small></div><div><b>${esc(w[2])}</b><br><small>${esc(w[3])}</small></div><div class="gate">${pct(a)}%</div></div>`}).join("")}</div>`}
function tasks(){let a=s.tasks.filter(t=>(of==="All"||t.owner===of)&&(sf==="All"||t.status===sf)&&(!q||[t.title,t.owner,t.area,t.week,t.accept,t.notes].join(" ").toLowerCase().includes(q.toLowerCase())));$("content").innerHTML=`<div class="hero"><div><div class="ey">Endpoint checklist</div><div class="title">Every detail, editable.</div><div class="sub">Search, filter, edit, complete and export. State is kept locally in your browser.</div></div></div><div class="filters"><input class="input search" placeholder="Search tasks, features, dependencies…" value="${esc(q)}" oninput="q=this.value;tasks()"><select class="input" onchange="of=this.value;tasks()"><option>All</option>${s.people.map(p=>`<option ${of===p.name?"selected":""}>${p.name}</option>`).join("")}</select><select class="input" onchange="sf=this.value;tasks()"><option>All</option>${["Todo","In progress","Blocked","Done"].map(x=>`<option ${sf===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="card">${a.map(row).join("")||"<div class='empty'>No matching tasks.</div>"}</div>`}
function people(){$("content").innerHTML=`<div class="hero"><div><div class="ey">Ownership</div><div class="title">Three owners, one product.</div><div class="sub">Primary lanes stay clear; AI/RAG is deliberately shared as a learning/build area.</div></div></div><div class="grid3">${s.people.map(p=>{let a=s.tasks.filter(x=>x.owner===p.name);return `<div class="card"><div class="person"><div class="avatar">${p.name[0]}</div><div class="grow"><strong>${p.name}</strong><small>${p.role}</small></div></div><div style="margin-top:16px"><div class="head"><span class="muted">Completion</span><b>${pct(a)}%</b></div><div class="bar"><i style="width:${pct(a)}%"></i></div></div><div style="margin-top:12px">${a.filter(x=>x.status!=="Done").slice(0,8).map(x=>`<div style="padding:8px 0;border-top:1px solid var(--line);font-size:11px">${esc(x.title)}<div class="muted" style="font-size:10px">${fmt(x.date)} · ${x.area}</div></div>`).join("")}</div></div>`}).join("")}</div>`}
function product(){$("content").innerHTML=`<div class="hero"><div><div class="ey">Product definition</div><div class="title">Nirmaana MVP</div><div class="sub">Diagnostic-only, non-advisory financial clarity for young Indians. Understand financial health, goals, risk scenarios and education before any investment conversation.</div></div></div><div class="grid2"><div class="card"><b>MVP feature set</b><div style="display:grid;gap:7px;margin-top:12px">${["Onboarding — manual entry","Financial health dashboard","Goal calculator","Risk scenario explorer","Education library — static + RAG Q&A","Adviser referral directory","Admin / compliance console"].map((x,i)=>`<div class="pill" style="padding:8px">0${i+1} · ${x}</div>`).join("")}</div></div><div class="card"><b>Compliance boundary</b><div class="muted" style="margin-top:10px">Allowed: generic education, pure arithmetic, all-category historical ranges, flat-fee referral. Not allowed: personalized investment/risk recommendations, matching only one category to a user, product/fund allocation advice, commission-based referral.</div></div></div><div class="section grid3"><div class="card"><b>Architecture</b><div class="muted" style="margin-top:9px"><strong>Raw data → rules engine → verified facts → visualization / AI narration.</strong><br><br>AI narrates approved data; it never becomes the financial calculation source of truth.</div></div><div class="card"><b>Technical source</b><div class="muted" style="margin-top:9px">Next.js 14 + TypeScript · Supabase Postgres/Auth/Storage/pgvector · Prisma · zod · React Hook Form · Recharts · Vercel · GitHub Actions · Sentry · Redis/Upstash.</div></div><div class="card"><b>Latest source</b><div class="muted" style="margin-top:9px">${esc(s.meta.source)}<br><br>${esc(s.meta.lastContext)}</div></div></div>`}
function toggle(id){let t=s.tasks.find(x=>x.id===id);t.status=t.status==="Done"?"Todo":"Done";save();render();toast(t.status==="Done"?"Marked done":"Reopened")}
function openModal(t){let v=t||{id:"",title:"",owner:"You",status:"Todo",date:"2026-10-06",week:"W1",area:"",priority:"P0",dep:"",accept:"",notes:""};$("mtitle").textContent=t?"Edit task":"Add task";for(let [i,k] of [["id","id"],["title","title"],["owner","owner"],["status","status"],["date","date"],["week","week"],["area","area"],["priority","priority"],["dep","dep"],["accept","accept"],["notes","notes"]])$(i).value=v[k]||"";$("modalbg").style.display="flex"}
function edit(id){openModal(s.tasks.find(x=>x.id===id))}function closeModal(){$("modalbg").style.display="none"}
$("form").onsubmit=e=>{e.preventDefault();let d={id:$("id").value||"t"+Date.now(),title:$("title").value,owner:$("owner").value,status:$("status").value,date:$("date").value,week:$("week").value,area:$("area").value,priority:$("priority").value,dep:$("dep").value,accept:$("accept").value,notes:$("notes").value};let i=s.tasks.findIndex(x=>x.id===d.id);if(i>=0)s.tasks[i]=d;else s.tasks.push(d);save();closeModal();render();toast("Saved")}
$("import").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{s=JSON.parse(r.result);save();render();toast("Imported")}catch{toast("Invalid JSON")}};r.readAsText(f)}
function exportData(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="nirmaana-endpoint-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Exported")}
render();
</script></body></html>
